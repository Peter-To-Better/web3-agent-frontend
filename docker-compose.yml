services:
  web:
    build: .
    image: hoya-bit-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Real backend (e.g. your Rust API). Leave unset to use the built-in
      # mock responses in app/api/chat/* for local/demo use.
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_CHAT_STREAM_PATH: ${BACKEND_CHAT_STREAM_PATH:-/chat/stream}
      BACKEND_CHAT_HISTORY_PATH: ${BACKEND_CHAT_HISTORY_PATH:-/chat/history}
