services:
  web:
    build: .
    image: hoya-bit-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Bedrock AgentCore Lambda Function URL (agentcore_stream_proxy.mjs).
      # Leave unset to use the built-in mock chat responses.
      AGENT_FUNCTION_URL: ${AGENT_FUNCTION_URL:-}
      AGENT_FUNCTION_URL_VERIFY_TOKEN: ${AGENT_FUNCTION_URL_VERIFY_TOKEN:-}
      # Real backend for endpoints not served by the Lambda above (e.g. chat
      # history). Leave unset to use the built-in mock chat history.
      BACKEND_URL: ${BACKEND_URL:-}
      BACKEND_CHAT_HISTORY_PATH: ${BACKEND_CHAT_HISTORY_PATH:-/chat/history}
